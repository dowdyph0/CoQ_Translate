services:
  db:
    image: postgres:16-alpine
    container_name: coq-db
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_DB=${DB_NAME:-coq_translate}
      - POSTGRES_USER=${DB_USER:-coq}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-coq}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Minimal RAM footprint: ~80-120 MB total
    command: >
      postgres
      -c shared_buffers=32MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=20
      -c wal_buffers=4MB
      -c checkpoint_completion_target=0.9
      -c effective_cache_size=128MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-coq} -d ${DB_NAME:-coq_translate}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  translation-editor:
    image: python:3.12-slim
    container_name: translation-editor
    restart: unless-stopped
    working_dir: /app/editor
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - "${STREAMING_ASSETS_DIR}/Base/ExampleLanguage:/example-language:ro"
    ports:
      - "3003:8000"
    command: >
      sh -c "pip install -r requirements.txt --quiet &&
             python manage.py migrate --run-syncdb &&
             python manage.py runserver 0.0.0.0:8000"

  llama-server:
    image: dexogen/atomic-llama-cpp-turboquant:cuda13
    container_name: llama-server
    restart: unless-stopped

    ports:
      - "9090:8080"

    volumes:
      # Mount the directory containing your GGUF model file(s)
      - ${MODELS_DIR:-./models}:/models:ro

    environment:
      - CUDA_VISIBLE_DEVICES=0
    #entrypoint: ""
    command: >
      --model /models/Qwen3-14B-UD-Q4_K_XL.gguf
      --alias Qwen3-14B
      --host 0.0.0.0
      --port 8080
      --ctx-size 16384
      --batch-size 512
      --n-gpu-layers 99
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --jinja
      --reasoning-budget 0
      --temp 0.6
      --top-k 20
      --top-p 0.95
      --min-p 0
      --repeat-penalty 1.1
      -np 4
      --no-warmup

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  db_data: