services:
  llama-server:
    image: dexogen/atomic-llama-cpp-turboquant:cuda13
    container_name: llama-server
    restart: unless-stopped

    ports:
      - "9090:8080"

    volumes:
      # Mount the directory containing your GGUF model file(s)
      - ${MODELS_DIR:-./models}:/models:ro

    environment:
      - CUDA_VISIBLE_DEVICES=0
    #entrypoint: ""
    command: >
      --model /models/Qwen3-14B-UD-Q4_K_XL.gguf
      --alias Qwen3-14B
      --host 0.0.0.0
      --port 8080
      --ctx-size 16384
      --batch-size 512
      --n-gpu-layers 99
      --flash-attn on
      --cache-type-k q8_0
      --cache-type-v q8_0
      --jinja
      --reasoning-budget 0
      --temp 0.6
      --top-k 20
      --top-p 0.95
      --min-p 0
      --repeat-penalty 1.1
      -np 4
      --metrics

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s