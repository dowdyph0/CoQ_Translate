# Caves of Qud Translation Pipeline - config.toml

# LLM server (llama.cpp OpenAI-compatible endpoint)
llm_endpoint = "http://localhost:9090/v1"
model        = "local-model"

# Launch example (RTX 5060 Ti 16 GB):
# llama-server -m Qwen3-14B-UD-Q4_K_XL.gguf --port 9090 ^
#   -ngl 99 -np 4 --ctx-size 16384 --batch-size 512 ^
#   --flash-attn --cache-type-k q8_0 --cache-type-v q8_0 ^
#   --reasoning-budget 0 --no-warmup

# Target language
target_language = "Spanish"
lang_code       = "es"

# Mod output folder (created in cwd).
# Structure: cwd/<mod_name>/languages/lang-<lang_code>/*.es.xml
#            cwd/<mod_name>/languages/languages.xml
#            cwd/<mod_name>/manifest.json
mod_name         = "SpanishLanguage"
mod_display_name = "Español"
mod_author       = "dowdyph0"

# Sampling parameters
temperature    = 0.6
top_k          = 20
top_p          = 0.95
min_p          = 0.0
repeat_penalty = 1.1
max_tokens     = 256

# Network
request_timeout = 120
request_delay   = 0.0
max_retries     = 3
retry_delay     = 5

# batch_size: strings per LLM call
# workers:    parallel file workers - match llama.cpp -np value
batch_size = 10
workers    = 4

# Absolute path to the game's StreamingAssets folder (source XMLs).
streaming_assets_dir = 'C:\Program Files (x86)\Steam\steamapps\common\Caves of Qud\CoQ_Data\StreamingAssets'
